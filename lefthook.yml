pre-commit:
  parallel: false
  commands:
    secrets:
      run: bash -c 'command -v gitleaks >/dev/null 2>&1 && gitleaks detect --source . -v --no-banner || true'
    check:
      run: npm run check

pre-push:
  parallel: false
  commands:
    check:
      run: npm run check
    test-all:
      run: npm run test:all
